<div class="faq-list">
  @for (item of items(); track item.question; let index = $index) {
    <details class="faq-item" name="hydraboost-faq" [attr.open]="index === 0 ? '' : null">
      <summary><h3>{{ item.question }}</h3><span class="faq-icon" aria-hidden="true"></span></summary>
      <div class="faq-answer"><p>{{ item.answer }}</p></div>
    </details>
  }
</div>
